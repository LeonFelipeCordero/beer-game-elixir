services:
  db:
    image: mysql:9.6
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: beer_game
      MYSQL_USER: beer_game
      MYSQL_PASSWORD: 12345
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20

  beer-game:
    build: ..
    image: elixir/beer-game
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://beer_game:12345@db/beer_game
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Generate with mix phx.gen.secret}
      PHX_HOST: ${PHX_HOST:-localhost}
    command:
      - sh
      - -c
      - bin/beer_game eval 'BeerGame.Release.migrate()' && exec bin/beer_game start
