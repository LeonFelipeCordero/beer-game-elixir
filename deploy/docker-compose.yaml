services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: beer_game
      POSTGRES_USER: beer_game
      POSTGRES_PASSWORD: "12345"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  beer-game:
    build: ..
    image: elixir/beer-game
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      DATABASE_URL: postgres://beer_game:12345@db/beer_game
      # Fixed development key for this local-only application.
      SECRET_KEY_BASE: "tcegFdURJ0SoW6SG1FUUadBoSuCHdvkORJYUbW7vWqd1IdwccfyvehLvhVGqfmPJ"
